<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гримёрка</title>
<meta name="description" content="Гримёрка: персонаж, визуальный код, школа блогинга, приёмы и банк идей для блога психолога.">
<meta name="theme-color" content="#17122B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гримёрка">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
<div id="app"></div>
<noscript>Для гримёрки нужен JavaScript.</noscript>
<script type="module" src="js/app.js?v=3"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then((r) => r.update()).catch(() => {}));
  }
</script>
</body>
</html>
