tems:center}.actions .primary{flex:1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:12px}textarea{min-height:240px;resize:vertical}.list{display:flex;flex-direction:column;gap:14px;margin:20px 0}.item{background:var(--paper);border:1px solid var(--line);border-left:4px solid #a3bc65;border-radius:12px;padding:20px 22px;display:flex;gap:18px;align-items:center}.item .content{flex:1;min-width:0}.item h3{font-size:19px;line-height:1.4;margin:6px 0;font-weight:620}.item .actions{gap:6px}.item button{padding:9px 12px}.tag{color:var(--green);font-size:12px;font-weight:650}.meta{font-size:13px;color:var(--muted)}.empty{padding:35px 0;color:var(--muted)}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.subnav button{background:transparent}.subnav .active{background:var(--accent);color:#151714}dialog{width:min(600px,calc(100% - 24px));max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);padding:26px}dialog::backdrop{background:#080a08bb}dialog h2{margin-bottom:20px}dialog label{margin-top:18px}footer{max-width:850px;margin:auto;padding:0 24px 30px;color:var(--muted);font-size:13px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d9f477;color:#151714;padding:12px 20px;border-radius:10px;z-index:9;max-width:90%}[hidden]{display:none!important}@media(max-width:620px){.top{display:block;padding:15px 16px}nav{margin-top:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}nav button{font-size:13px;padding:9px 4px}main{padding:28px 16px 50px}.fields{grid-template-columns:1fr;gap:12px}.item{display:block;padding:18px}.item .actions{margin-top:12px}.panel{margin-top:20px}.actions .primary{flex-basis:100%}.idea{min-height:190px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
</style><header><div class="top"><div class="brand">МИР <span>/</span> НАС</div><nav id="nav" aria-label="Разделы"></nav></div></header><main id="main"></main><footer><span id="warning"></span><p>Личная картотека · работает офлайн</p></footer><div id="toast" role="status" hidden></div><dialog id="editor"><form id="form"><h2 id="editorTitle"></h2><div id="newFields"><label for="newText">Тема</label><input id="newText"><label for="newCat">Направление</label><select id="newCat"></select></div><p id="editTopic"></p><label for="note">Сценарий / заметки</label><textarea id="note" placeholder="Хук, культурный объект, психологическая мысль, финал…"></textarea><div class="actions" style="margin-top:18px"><button class="primary" type="submit">Сохранить</button><button type="button" id="cancel">Закрыть</button></div></form></dialog><input type="file" id="file" accept="application/json,.json" hidden><script>const DATA={"items": [{"id": "0-0", "cat": "Музыка и психика", "text": "Почему, когда нам плохо, мы включаем музыку, от которой становится ещё грустнее?"}, {"id": "0-1", "cat": "Музыка и психика", "text": "Почему агрессивная музыка может нас успокаивать?"}, {"id": "0-2", "cat": "Музыка и психика", "text": "Почему мы любим песни, смысл которых совершенно не понимаем?"}, {"id": "0-3", "cat": "Музыка и психика", "text": "Почему одна песня способна вернуть нас на пять лет назад?"}, {"id": "0-4", "cat": "Музыка и психика", "text": "Почему любимый трек перестаёт нравиться, когда его слушают все?"}, {"id": "0-5", "cat": "Музыка и психика", "text": "Почему нам бывает стыдно за собственный плейлист?"}, {"id": "0-6", "cat": "Музыка и психика", "text": "Почему после расставания мы продолжаем слушать общие песни?"}, {"id": "0-7", "cat": "Музыка и психика", "text": "Можно ли понять человека по его музыкальному вкусу?"}, {"id": "1-0", "cat": "Попса и андеграунд", "text": "Почему мы презираем попсу, но знаем её наизусть?"}, {"id": "1-1", "cat": "Попса и андеграунд", "text": "Почему музыкальный вкус становится поводом чувствовать себя выше других?"}, {"id": "1-2", "cat": "Попса и андеграунд", "text": "Почему люди так любят говорить, что слушали исполнителя до его популярности?"}, {"id": "1-3", "cat": "Попса и андеграунд", "text": "Почему нам нравится искусство, которое никто не понимает?"}, {"id": "1-4", "cat": "Попса и андеграунд", "text": "Зачем андеграунду нужна провокация?"}, {"id": "1-5", "cat": "Попса и андеграунд", "text": "Почему искренность в попсе кажется нам кринжовой, а в андеграунде — гениальной?"}, {"id": "1-6", "cat": "Попса и андеграунд", "text": "Почему нам хочется найти артиста, о котором никто не знает?"}, {"id": "1-7", "cat": "Попса и андеграунд", "text": "Что мы на самом деле защищаем, когда спорим о музыке?"}, {"id": "2-0", "cat": "Одиночество и отчуждение", "text": "Почему одиночество в кино выглядит красиво, а в жизни ощущается иначе?"}, {"id": "2-1", "cat": "Одиночество и отчуждение", "text": "Как одиночество стало эстетикой?"}, {"id": "2-2", "cat": "Одиночество и отчуждение", "text": "Почему иногда хочется исчезнуть, но при этом хочется, чтобы тебя искали?"}, {"id": "2-3", "cat": "Одиночество и отчуждение", "text": "Почему мы можем чувствовать себя одинокими среди друзей?"}, {"id": "2-4", "cat": "Одиночество и отчуждение", "text": "Почему нам проще фантазировать о близости, чем строить её?"}, {"id": "2-5", "cat": "Одиночество и отчуждение", "text": "Почему образ непонятого человека так привлекателен?"}, {"id": "2-6", "cat": "Одиночество и отчуждение", "text": "Почему ночной город вызывает ощущение особенной свободы?"}, {"id": "2-7", "cat": "Одиночество и отчуждение", "text": "Почему иногда нам хочется, чтобы нас просто оставили в покое?"}, {"id": "3-0", "cat": "Любовь и отношения в культуре", "text": "Почему самые нездоровые отношения становятся самыми красивыми историями любви?"}, {"id": "3-1", "cat": "Любовь и отношения в культуре", "text": "Почему эмоционально недоступные персонажи кажутся такими привлекательными?"}, {"id": "3-2", "cat": "Любовь и отношения в культуре", "text": "Почему нам нравится идея любви, которая должна причинять боль?"}, {"id": "3-3", "cat": "Любовь и отношения в культуре", "text": "Почему в кино ревность часто выдают за любовь?"}, {"id": "3-4", "cat": "Любовь и отношения в культуре", "text": "Почему мы романтизируем людей, которых невозможно спасти?"}, {"id": "3-5", "cat": "Любовь и отношения в культуре", "text": "Почему несчастная любовь вдохновляет больше, чем счастливая?"}, {"id": "3-6", "cat": "Любовь и отношения в культуре", "text": "Почему стабильные отношения в сериалах кажутся скучными?"}, {"id": "3-7", "cat": "Любовь и отношения в культуре", "text": "Почему нам так нравится троп «от ненависти до любви»?"}, {"id": "4-0", "cat": "Интернет-культура и мемы", "text": "Почему нам легче отправить мем, чем признаться в своих чувствах?"}, {"id": "4-1", "cat": "Интернет-культура и мемы", "text": "Почему мы шутим о том, что на самом деле причиняет нам боль?"}, {"id": "4-2", "cat": "Интернет-культура и мемы", "text": "Как мемы стали способом говорить о психическом здоровье?"}, {"id": "4-3", "cat": "Интернет-культура и мемы", "text": "Почему чужой кринж вызывает у нас физический дискомфорт?"}, {"id": "4-4", "cat": "Интернет-культура и мемы", "text": "Почему мы иногда специально смотрим контент, который нас раздражает?"}, {"id": "4-5", "cat": "Интернет-культура и мемы", "text": "Почему интернет так любит коллективно ненавидеть одного человека?"}, {"id": "4-6", "cat": "Интернет-культура и мемы", "text": "Почему мы читаем комментарии раньше, чем досматриваем видео?"}, {"id": "4-7", "cat": "Интернет-культура и мемы", "text": "Почему даже искренние признания в интернете превращаются в шутку?"}, {"id": "5-0", "cat": "Цинизм, ирония и защитные маски", "text": "Как цинизм стал признаком интеллектуальности?"}, {"id": "5-1", "cat": "Цинизм, ирония и защитные маски", "text": "Почему нам стыдно искренне чем-то восхищаться?"}, {"id": "5-2", "cat": "Цинизм, ирония и защитные маски", "text": "Почему быть равнодушным стало модно?"}, {"id": "5-3", "cat": "Цинизм, ирония и защитные маски", "text": "Когда самоирония превращается в самообесценивание?"}, {"id": "5-4", "cat": "Цинизм, ирония и защитные маски", "text": "Почему проще сказать «мне всё равно», чем признать, что тебе больно?"}, {"id": "5-5", "cat": "Цинизм, ирония и защитные маски", "text": "Почему мы обесцениваем то, чего сильно хотим?"}, {"id": "5-6", "cat": "Цинизм, ирония и защитные маски", "text": "Почему людям нравится образ человека, которому никто не нужен?"}, {"id": "5-7", "cat": "Цинизм, ирония и защитные маски", "text": "Что скрывается за привычкой превращать всё в шутку?"}, {"id": "6-0", "cat": "Эстетики и визуальная культура", "text": "Почему нам так нравится эстетика меланхолии?"}, {"id": "6-1", "cat": "Эстетики и визуальная культура", "text": "Почему мы романтизируем сигареты, бессонные ночи и пустые улицы?"}, {"id": "6-2", "cat": "Эстетики и визуальная культура", "text": "Почему фотографии на старую мыльницу кажутся нам более живыми?"}, {"id": "6-3", "cat": "Эстетики и визуальная культура", "text": "Почему заброшенные места вызывают странное чувство спокойствия?"}, {"id": "6-4", "cat": "Эстетики и визуальная культура", "text": "Почему эстетика роскоши иногда вызывает не восхищение, а отвращение?"}, {"id": "6-5", "cat": "Эстетики и визуальная культура", "text": "Почему некоторые люди превращают собственную грусть в визуальный стиль?"}, {"id": "6-6", "cat": "Эстетики и визуальная культура", "text": "Почему нам хочется, чтобы наша жизнь выглядела как фильм?"}, {"id": "6-7", "cat": "Эстетики и визуальная культура", "text": "Когда эстетика становится способом спрятаться от реальности?"}, {"id": "7-0", "cat": "Кино, сериалы и персонажи", "text": "Почему злодеи иногда нравятся нам больше главных героев?"}, {"id": "7-1", "cat": "Кино, сериалы и персонажи", "text": "Почему мы оправдываем поступки любимых персонажей?"}, {"id": "7-2", "cat": "Кино, сериалы и персонажи", "text": "
